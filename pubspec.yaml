name: easy_chromecast_plugin
description: A modern, type-safe Flutter plugin for Google Chromecast. Powered by Kotlin and Pigeon, optimized for streaming VOD and Live IPTV streams (.ts, .m3u8, .mp4).
version: 1.0.3
# Vervang onderstaande URL's door je eigen GitHub repository zodra je hem hebt gepusht
repository: https://github.com/johandb/easy_chromecast_plugin.git
issue_tracker: https://github.com/johandb/easy_chromecast_plugin/issues

environment:
  sdk: '^3.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8  

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^28.0.0

topics:
  - chromecast
  - google-cast
  - iptv
  - video-streaming
  - media-player

flutter:
  plugin:
    platforms:
      android:
        package: com.jdbs.iptv.easy_chromecast_plugin
        pluginClass: EasyChromecastPlugin
      ios:
        pluginClass: EasyChromecastPlugin
