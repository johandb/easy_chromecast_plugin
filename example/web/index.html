<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Demonstrates how to use the easy_chromecast_plugin plugin.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="easy_chromecast_plugin_example">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

	<!-- Officiële Google Cast Framework Initialisatie -->
	<script type="text/javascript">
	  window.__onGCastApiAvailable = function(isAvailable) {
		if (isAvailable) {
		  // Zodra Chrome de API stand-by heeft staan, stellen we direct de opties in
		  var context = cast.framework.CastContext.getInstance();
		  context.setOptions({
			receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
			autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
		  });
		  window.isChromecastSdkReady = true;
		  console.log('Google Cast Web SDK succesvol stand-by gezet via index.html!');
		}
	  };
	</script>
	<script type="text/javascript" src="https://gstatic.com"></script>

  <title>easy_chromecast_plugin_example</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <google-cast-launcher style="display: none;"></google-cast-launcher>
</body>
</html>
